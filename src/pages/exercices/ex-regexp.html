<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-base-100">
<!-- NAVBAR -->
<nav class="navbar bg-base-100 shadow-sm px-6">

    <div class="flex-1">
        <a href="/" class="text-2xl font-bold">
            JS Learning
        </a>
    </div>

    <div class="flex-none">
        <ul id="navigation" class="menu menu-horizontal px-1">
            <!-- Généré automatiquement -->
        </ul>
    </div>

</nav>
<main class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="card w-full max-w-sm bg-base-200 shadow-xl">
        <div class="card-body">
            <h2 class="card-title justify-center">Connexion</h2>

            <form id="login-form" class="flex flex-col gap-3">
                <div>
                    <label class="label" for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="nom@exemple.com"
                           class="input input-bordered w-full" required />
                </div>

                <div>
                    <label class="label" for="password">Mot de passe</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           class="input input-bordered w-full" required />
                </div>

                <label class="label cursor-pointer justify-start gap-2">
                    <input type="checkbox" class="checkbox checkbox-sm" />
                    <span>Se souvenir de moi</span>
                </label>

                <p id="form-error" class="text-error text-sm hidden"></p>

                <button type="submit" class="btn btn-primary w-full">Se connecter</button>
                <a href="#" class="link link-hover text-sm text-center">Mot de passe oublié ?</a>
            </form>
        </div>
    </div>
</main>
<script type="module" src="/src/main.js"></script>
<script src="ex-regexp.js"></script>
</body>
</html>
